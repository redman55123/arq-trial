<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Platformer - Forest, Desert & Castle Adventure</title>
    <link rel="stylesheet" href="css/game.css">
</head>
<body>
    <div id="game-container">
        <!-- Main Menu -->
        <div id="main-menu">
            <h1>Platformer Adventure</h1>
            <p class="subtitle">Forest • Desert • Castle</p>
            <div id="level-select">
                <h2>Select Level</h2>
                <div class="level-buttons">
                    <button class="level-btn forest" data-level="1">
                        <span class="level-name">Forest</span>
                        <span class="level-desc">Small • Beginner</span>
                    </button>
                    <button class="level-btn desert" data-level="2">
                        <span class="level-name">Desert</span>
                        <span class="level-desc">Medium • Intermediate</span>
                    </button>
                    <button class="level-btn castle" data-level="3">
                        <span class="level-name">Castle</span>
                        <span class="level-desc">Large • Advanced</span>
                    </button>
                </div>
            </div>
            <div id="scoreboard-panel">
                <h2>Scoreboard</h2>
                <div id="scoreboard-content"></div>
            </div>
            <div class="controls-info">
                <p><strong>Controls:</strong> Arrow keys or WASD to move • Spacebar to jump</p>
            </div>
        </div>

        <!-- Game Canvas -->
        <canvas id="game-canvas" style="display: none;"></canvas>

        <!-- In-Game HUD -->
        <div id="game-hud" style="display: none;">
            <div class="hud-left">
                <span id="hud-score">Score: 0</span>
                <span id="hud-time">Time: 0:00</span>
                <span id="hud-deaths">Deaths: 0</span>
            </div>
            <div class="hud-right">
                <button id="pause-btn">Pause</button>
                <button id="menu-btn">Menu</button>
            </div>
        </div>

        <!-- Pause Overlay -->
        <div id="pause-overlay" style="display: none;">
            <h2>Paused</h2>
            <button id="resume-btn">Resume</button>
        </div>

        <!-- Game Over / Victory Overlay -->
        <div id="game-overlay" style="display: none;">
            <div id="overlay-content">
                <h2 id="overlay-title">Level Complete!</h2>
                <div id="overlay-stats"></div>
                <div class="overlay-buttons">
                    <button id="retry-btn">Retry</button>
                    <button id="next-level-btn">Next Level</button>
                    <button id="back-menu-btn">Back to Menu</button>
                </div>
            </div>
        </div>
    </div>

    <script src="js/levels.js"></script>
    <script src="js/player.js"></script>
    <script src="js/scoreboard.js"></script>
    <script src="js/game.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
